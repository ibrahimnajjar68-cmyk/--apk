name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses Automatically
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n89339e542afb5630c58ed00c99b0007d2f3757dd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a6371d6a4d13a0f7b266227678d2124e2" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a323e05a0b6931d86aaa1335f67" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "\n33b6a2b64925ea171387396a11e0725e11f6300a" > $ANDROID_HOME/licenses/google-gdk-license
          echo -e "\ne9672915a443004b307b55311243984883b80897" > $ANDROID_HOME/licenses/intel-android-sysimage-license
          echo -e "\nd9754edd51764c3978035f7d2db642782e20d5f1" > $ANDROID_HOME/licenses/android-googletv-license

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: npx cap add android || npx cap sync android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply configuration (permissions, icon, name, colors)
        run: node scripts/customize-android.mjs

      - name: Grant gradlew execute
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: dist/app.apk

      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build #${{ github.run_number }}
          files: dist/app.apk
